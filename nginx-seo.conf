# Nginx SEO, Security, and Routing Configuration for IDR Tech

server {
    listen 80;
    listen [::]:80;
    server_name www.idrtech.in idrtech.in;
    return 301 https://idrtech.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.idrtech.in;
    
    # SSL certificates details go here...

    return 301 https://idrtech.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name idrtech.in;

    root /var/www/idr-landing-page/dist;
    index index.html;

    # SSL certificates details go here...

    # Security Headers for Technical SEO & compliance
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://idr-backend-49rq.onrender.com https://www.google-analytics.com; frame-src 'self' https://www.googletagmanager.com; upgrade-insecure-requests;" always;

    # SPA Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (Core Web Vitals)
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|ico|svg|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # XML Sitemaps and Robots.txt
    location ~* \.(?:xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }
}
